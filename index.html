<style>
  .summary-panel-live{padding:24px;min-height:620px}
  .summary-head-live{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
  .summary-title-live{font-size:36px;letter-spacing:-.05em;margin:4px 0}
  .summary-controls-live{display:grid;grid-template-columns:1.4fr .9fr .9fr .9fr;gap:10px;margin:16px 0}
  .summary-list-live{display:grid;gap:12px}
  .summary-item-live{border:1px solid #344136;border-left:6px solid var(--green);border-radius:18px;padding:16px;background:#1b281f}
  .summary-item-live.design{border-left-color:var(--blue)}
  .summary-item-live.purchasing{border-left-color:var(--gold)}
  .summary-top-live{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .summary-floorplan-live{font-weight:900;color:#eaffea;font-size:18px}
  .summary-description-live{font-weight:900;margin-top:4px;color:var(--ink)}
  .summary-notes-live{margin-top:10px;color:var(--muted);line-height:1.45}
  .summary-meta-live{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .summary-meta-live span{border-radius:999px;background:#243126;color:var(--muted);padding:6px 10px;font-size:12px;font-weight:800}
  @media(max-width:1000px){
    .summary-controls-live{grid-template-columns:1fr}
    .summary-head-live,.summary-top-live{flex-direction:column}
  }
</style>

<script>
(function(){
  if (document.getElementById('summaryPanelLivePatch')) return;

  const cfg = window.ARIVE_CONFIG || {};
  const SCRIPT_URL = (cfg.WEB_APP_URL || cfg.APPS_SCRIPT_URL || cfg.GOOGLE_SCRIPT_URL || '').trim();
  let changes = [];
  let plans = [];

  const statusBanner = document.getElementById('statusBanner');
  const floorplanView = document.getElementById('floorplanView') || document.querySelector('.grid');

  const toggle = document.createElement('div');
  toggle.className = 'view-toggle-live';
  toggle.innerHTML = `
    <button id="liveFloorplanBtn" class="active" type="button">Floorplan View</button>
    <button id="liveSummaryBtn" type="button">All Changes Summary</button>
  `;
  statusBanner.insertAdjacentElement('afterend', toggle);

  const panel = document.createElement('section');
  panel.id = 'summaryPanelLivePatch';
  panel.className = 'panel summary-panel-live';
  panel.hidden = true;
  panel.innerHTML = `
    <div class="summary-head-live">
      <div>
        <div class="eyebrow">All Changes</div>
        <h2 class="summary-title-live">Recent Change Summary</h2>
        <p>Every active change sorted from most recent to oldest.</p>
      </div>
      <button id="summaryRefreshLive" class="btn ghost" type="button">Refresh</button>
    </div>

    <div class="summary-controls-live">
      <input id="summarySearchLive" type="search" placeholder="Search descriptions, notes, floorplans...">
      <select id="summaryStatusLive">
        <option value="all">All statuses</option>
        <option>Purchasing</option>
        <option>Curtis Design</option>
        <option>Complete</option>
      </select>
      <select id="summaryTypeLive"><option value="all">All change types</option></select>
      <select id="summaryPlanLive"><option value="all">All floorplans</option></select>
    </div>

    <div id="summaryListLive" class="summary-list-live">
      <div class="empty"><strong>Loading changes...</strong><p>Pulling live data from Apps Script.</p></div>
    </div>
  `;

  floorplanView.insertAdjacentElement('afterend', panel);

  document.getElementById('liveFloorplanBtn').onclick = function(){
    floorplanView.hidden = false;
    panel.hidden = true;
    this.classList.add('active');
    document.getElementById('liveSummaryBtn').classList.remove('active');
  };

  document.getElementById('liveSummaryBtn').onclick = function(){
    floorplanView.hidden = true;
    panel.hidden = false;
    this.classList.add('active');
    document.getElementById('liveFloorplanBtn').classList.remove('active');
    loadSummary();
  };

  document.getElementById('summaryRefreshLive').onclick = loadSummary;
  ['summarySearchLive','summaryStatusLive','summaryTypeLive','summaryPlanLive'].forEach(id => {
    const el = document.getElementById(id);
    el.oninput = renderSummary;
    el.onchange = renderSummary;
  });

  const form = document.getElementById('changeForm');
  if (form) {
    form.addEventListener('submit', function(){
      setTimeout(loadSummary, 3000);
      setTimeout(loadSummary, 6500);
    });
  }

  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function(){
      setTimeout(loadSummary, 2500);
    });
  }

  async function loadSummary(){
    if (!SCRIPT_URL) {
      document.getElementById('summaryListLive').innerHTML =
        '<div class="empty"><strong>Missing Apps Script URL</strong><p>This uses your existing config.js file.</p></div>';
      return;
    }

    document.getElementById('summaryListLive').innerHTML =
      '<div class="empty"><strong>Loading changes...</strong><p>Pulling live data from Apps Script.</p></div>';

    try {
      const data = await jsonp(SCRIPT_URL, { action:'list', t:Date.now() }, 20000);
      const rawChanges = Array.isArray(data.changes) ? data.changes : [];
      const rawPlans = Array.isArray(data.plans) ? data.plans : (Array.isArray(data.floorplans) ? data.floorplans : []);

      changes = rawChanges.map(normChange).filter(c => c.floorplan && active(c));
      plans = rawPlans.map(normPlan).filter(p => p.name);

      populateSummaryFilters();
      renderSummary();
    } catch (err) {
      document.getElementById('summaryListLive').innerHTML =
        '<div class="empty"><strong>Could not load changes</strong><p>Click Debug to confirm Apps Script is working.</p></div>';
    }
  }

  function populateSummaryFilters(){
    const typeEl = document.getElementById('summaryTypeLive');
    const planEl = document.getElementById('summaryPlanLive');

    const oldType = typeEl.value || 'all';
    const oldPlan = planEl.value || 'all';

    const types = [...new Set(changes.map(c => c.changeType).filter(Boolean))].sort();
    const planNames = [...new Set([
      ...plans.map(p => p.name),
      ...changes.map(c => c.floorplan)
    ].filter(Boolean))].sort();

    typeEl.innerHTML = '<option value="all">All change types</option>' +
      types.map(t => `<option>${esc(t)}</option>`).join('');

    planEl.innerHTML = '<option value="all">All floorplans</option>' +
      planNames.map(p => `<option>${esc(p)}</option>`).join('');

    typeEl.value = types.includes(oldType) ? oldType : 'all';
    planEl.value = planNames.includes(oldPlan) ? oldPlan : 'all';
  }

  function renderSummary(){
    const q = (document.getElementById('summarySearchLive').value || '').toLowerCase();
    const statusFilter = document.getElementById('summaryStatusLive').value || 'all';
    const typeFilter = document.getElementById('summaryTypeLive').value || 'all';
    const planFilter = document.getElementById('summaryPlanLive').value || 'all';

    let list = [...changes].sort((a,b) => {
      const ad = dateValue(a.changeDate) || dateValue(a.lastUpdated);
      const bd = dateValue(b.changeDate) || dateValue(b.lastUpdated);
      return bd - ad;
    });

    list = list.filter(c => {
      const text = [
        c.floorplan, c.changeDate, c.changeType, c.description,
        c.reason, c.requestedBy, c.approvedBy, c.notes, c.costImpact
      ].join(' ').toLowerCase();

      return (!q || text.includes(q)) &&
        (statusFilter === 'all' || mapStatus(c.status) === statusFilter) &&
        (typeFilter === 'all' || c.changeType === typeFilter) &&
        (planFilter === 'all' || c.floorplan === planFilter);
    });

    const target = document.getElementById('summaryListLive');

    if (!list.length) {
      target.innerHTML = '<div class="empty"><strong>No matching changes</strong><p>Try clearing the filters.</p></div>';
      return;
    }

    target.innerHTML = list.map(c => {
      const st = mapStatus(c.status);
      const klass = st === 'Complete' ? 'complete' : st === 'Curtis Design' ? 'design' : 'purchasing';

      return `
        <article class="summary-item-live ${klass}">
          <div class="summary-top-live">
            <div>
              <div class="summary-floorplan-live">${esc(c.floorplan)}</div>
              <div class="summary-description-live">${esc(c.description || '(No description)')}</div>
            </div>
            <span class="chip ${klass}">${esc(st)}</span>
          </div>

          <div class="summary-meta-live">
            <span>${esc(c.changeDate || 'No date')}</span>
            <span>${esc(c.changeType || 'Other')}</span>
            ${c.costImpact ? `<span>${esc(c.costImpact)}</span>` : ''}
            <span>Requested: ${esc(c.requestedBy || 'N/A')}</span>
            <span>Approved: ${esc(c.approvedBy || 'N/A')}</span>
          </div>

          ${c.notes ? `<p class="summary-notes-live"><strong>Notes:</strong> ${esc(c.notes)}</p>` : ''}
          ${c.reason ? `<p class="summary-notes-live"><strong>Reason:</strong> ${esc(c.reason)}</p>` : ''}
        </article>
      `;
    }).join('');
  }

  function normPlan(p){
    return {
      name: String(p.name || p.floorplan || p.plan || '').trim()
    };
  }

  function normChange(c){
    return {
      id: String(c.id || c.changeId || '').trim(),
      floorplan: String(c.floorplan || c.plan || '').trim(),
      changeDate: String(c.changeDate || c.date || '').trim(),
      changeType: String(c.changeType || c.type || 'Other').trim(),
      description: String(c.description || c.changeDescription || '').trim(),
      reason: String(c.reason || '').trim(),
      requestedBy: String(c.requestedBy || '').trim(),
      approvedBy: String(c.approvedBy || '').trim(),
      status: String(c.status || 'Purchasing').trim(),
      costImpact: String(c.costImpact || '').trim(),
      notes: String(c.notes || '').trim(),
      lastUpdated: String(c.lastUpdated || '').trim(),
      active: String(c.active || 'Yes').trim()
    };
  }

  function active(c){
    return !/^no|false|0|archived$/i.test(String(c.active || 'Yes').trim());
  }

  function mapStatus(s){
    s = String(s || '').toLowerCase();
    if (s === 'complete' || s === 'approved') return 'Complete';
    if (s.includes('curtis') || s === 'design' || s === 'in review') return 'Curtis Design';
    return 'Purchasing';
  }

  function dateValue(v){
    const d = new Date(v);
    return Number.isNaN(d.getTime()) ? 0 : d.getTime();
  }

  function jsonp(url, params, timeout){
    return new Promise((resolve, reject) => {
      const cb = 'summaryCb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const timer = setTimeout(() => cleanup(() => reject(new Error('Timeout'))), timeout || 15000);

      window[cb] = data => cleanup(() => resolve(data));

      const full = new URL(url);
      Object.entries(params || {}).forEach(([k,v]) => full.searchParams.set(k,v));
      full.searchParams.set('callback', cb);

      script.src = full.toString();
      script.onerror = () => cleanup(() => reject(new Error('Script request failed')));

      function cleanup(done){
        clearTimeout(timer);
        try { delete window[cb]; } catch(e) { window[cb] = undefined; }
        script.remove();
        done();
      }

      document.head.appendChild(script);
    });
  }

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));
  }
})();
</script>
